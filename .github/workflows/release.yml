name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - '!*.*.*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: afatFdArm32
            task: assembleAfatFdArm32Release
            abi: armeabi-v7a
          - flavor: afatFdArm64
            task: assembleAfatFdArm64Release
            abi: arm64-v8a
          - flavor: afatFdX86
            task: assembleAfatFdX86Release
            abi: x86
          - flavor: afatFdX86_64
            task: assembleAfatFdX86_64Release
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Build APK
        id: build
        uses: ./.github/actions/build-mg
        with:
          flavor: ${{ matrix.flavor }}
          task: ${{ matrix.task }}
          abi: ${{ matrix.abi }}
          build-type: release
          artifact-version: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0.0' }}
          build-tag: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0.0' }}
          app-id: ${{ secrets.APP_ID }}
          app-hash: ${{ secrets.APP_HASH }}
          release-keystore-b64: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ steps.build.outputs.apk_path }}

  changelog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$CURRENT_TAG" ]; then
            echo "Not a tag push — skipping changelog generation"
            echo "No changelog for manual builds." > "$RUNNER_TEMP/changelog.md"
            exit 0
          fi

          PREV_TAG=$(git tag -l '[0-9]*' --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -A1 "^${CURRENT_TAG}$" | tail -1) || true
          echo "Current tag: ${CURRENT_TAG}"

          if [ "$PREV_TAG" = "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            echo "Previous stable tag: none — diffing against current tag only"
            PREV_TAG=""
          else
            echo "Previous stable tag: ${PREV_TAG} — diffing ${PREV_TAG}..${CURRENT_TAG}"
          fi

          bash .github/scripts/changelog-ai.sh "$PREV_TAG" "$CURRENT_TAG" "$RUNNER_TEMP/changelog.md"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog.md

  release:
    runs-on: ubuntu-24.04
    needs: [build, changelog]
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: apk-*
          merge-multiple: true
          path: artifacts/

      - name: Download changelog artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: changelog
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          body_path: artifacts/changelog.md
          files: artifacts/*.apk
