name: Debug Build

on:
  push:
    branches: [Mercurygram, fix/save-to-downloads-race]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install host build tools
        run: sudo apt-get install -y --no-install-recommends gperf meson libuv1-dev nasm cmake ninja-build yasm

      - name: Parse NDK version
        run: |
          ndk=$(grep -oE 'ndkVersion[[:space:]]+"[0-9.]+"' TMessagesProj/build.gradle | grep -oE '[0-9.]+')
          echo "NDK_VERSION=$ndk" >> "$GITHUB_ENV"

      - name: Ensure NDK installed
        run: |
          ndk_dir="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -f "$ndk_dir/source.properties" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          fi

      - name: Set API keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

      - name: Build arm64 debug APK
        run: ./gradlew assembleAfatFdArm64Debug -PMG_BUILD_TAG=1.0.0.0 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mercurygram-debug-arm64-v8a
          path: TMessagesProj_App/build/outputs/apk/afatFdArm64/debug/*.apk
